name: Mobile release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (preview = debug APK via artifact, production = publish to GitHub Release)
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      notes:
        description: Release/build notes
        required: true
      min_version_code:
        description: Minimum supported versionCode
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dvlp-front/dvlp-movil/guardian-escolar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dvlp-front/dvlp-movil/guardian-escolar/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Increase Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> ~/.gradle/gradle.properties

      - name: Build Android APK locally
        run: eas build -p android --profile ${{ inputs.profile }} --local --non-interactive --output guardian-escolar-${{ inputs.profile }}.apk

      - name: Read APK version info
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          BADGING="$("$AAPT" dump badging guardian-escolar-${{ inputs.profile }}.apk | head -1)"
          echo "VERSION_CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")" >> "$GITHUB_ENV"

      - name: Upload APK as artifact (preview only)
        if: ${{ inputs.profile == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: guardian-escolar-preview-${{ github.run_number }}
          path: dvlp-front/dvlp-movil/guardian-escolar/guardian-escolar-preview.apk
          retention-days: 7

      - name: Prepare latest.json (production only)
        if: ${{ inputs.profile == 'production' }}
        env:
          NOTES: ${{ inputs.notes }}
          MIN_CODE: ${{ inputs.min_version_code }}
        run: |
          jq -n \
            --arg vn "$VERSION_NAME" --argjson vc "$VERSION_CODE" --argjson min "$MIN_CODE" \
            --arg url "https://github.com/${{ github.repository }}/releases/latest/download/guardian-escolar.apk" \
            --arg notes "$NOTES" \
            '{versionName:$vn, versionCode:$vc, minVersionCode:$min, apkUrl:$url, notes:$notes}' > latest.json

      - name: Publish GitHub Release (production only)
        if: ${{ inputs.profile == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "mobile-v${VERSION_NAME}-${VERSION_CODE}" \
            guardian-escolar-production.apk latest.json \
            --title "Mobile app ${VERSION_NAME} (${VERSION_CODE})" \
            --notes "$NOTES" --latest