services:
  backend:
    container_name: backend-container-dev
    build:
      context: ./dvlp-back/src/backend
      dockerfile: dev.Dockerfile
    env_file:
      - ./dvlp-back/src/backend/.env
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AllowedOrigins=http://localhost:4200
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Contenedor de desarrollo para el frontend
  frontend-web:
    container_name: frontend-container-dev
    build:
      context: ./dvlp-front/dvlp-web/
      dockerfile: dev.Dockerfile
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    volumes:
      - ./dvlp-front/dvlp-web/src:/app/src

  postgres:
    image: postgres:16-alpine
    container_name: school-guardian-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - school-guardian-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_juan -d school-guardian"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  liquibase:
    image: liquibase/liquibase:4.29
    container_name: liquibase_container
    volumes:
      - ${SCHOOL_GUARDIAN_DB_DIR-./school-guardian-db}:/workspace
      - ./dvlp-back/liquibase/drivers/postgresql-42.7.10.jar:/liquibase/lib/postgresql.jar
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --defaultsFile=/workspace/liquibase.properties
      --searchPath=/workspace
      --changeLogFile=changelog/changelog-master.yaml
      update

