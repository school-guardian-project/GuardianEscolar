services:
  frontend-web:
    container_name: frontend-container-dev
    build:
      context: ./dvlp-front/dvlp-web/
      dockerfile: dev.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./dvlp-front/dvlp-web/src:/app/src
    networks:
      - sg-services-network

networks:
  sg-services-network:
    external: true