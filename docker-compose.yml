services:
  frontend-web:
    container_name: frontend-container-dev
    build:
      context: ./dvlp-front/dvlp-web/
      dockerfile: dev.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./dvlp-front/dvlp-web/src:/app/src
      - ./dvlp-front/dvlp-web/.env:/app/.env
    networks:
      - sg-services-network

  expo:
    image: node:20
    working_dir: /app
    volumes:
      - ./dvlp-front/dvlp-movil/guardian-escolar:/app
      - expo_node_modules:/app/node_modules
    ports:
      - "9081:9081"
      - "19000-19002:19000-19002"
    env_file:
      - ./dvlp-front/dvlp-movil/guardian-escolar/.env
    environment:
      EXPO_UNSTABLE_HEADLESS: "1"
    tty: true
    networks:
      - sg-services-network
    command: sh -c "[ -d node_modules/expo ] || npm install; export REACT_NATIVE_PACKAGER_HOSTNAME=\"$${EXPO_LAN_IP:-}\"; exec npx expo start --lan --port 9081"

volumes:
  expo_node_modules:

networks:
  sg-services-network:
    external: true
