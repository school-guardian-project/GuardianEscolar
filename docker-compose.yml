services:
  frontend-web:
    container_name: frontend-container-dev
    build:
      context: ./dvlp-front/dvlp-web/
      dockerfile: dev.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./dvlp-front/dvlp-web/src:/app/src
      - ./dvlp-front/dvlp-web/public:/app/public
      - ./dvlp-front/dvlp-web/.env:/app/.env
    networks:
      - sg-services-network

  expo:
    image: node:20
    working_dir: /app
    volumes:
      - ./dvlp-front/dvlp-movil/guardian-escolar:/app
      - expo_node_modules:/app/node_modules
    ports:
      # Metro local, solo para el modo --lan. En --tunnel el celular baja el
      # bundle por exp.direct y este puerto no se toca. Se eliminó
      # 19000-19002: nada escuchaba ahí (verificado en /proc/net/tcp).
      - "9081:9081"
    env_file:
      - ./dvlp-front/dvlp-movil/guardian-escolar/.env
    environment:
      EXPO_UNSTABLE_HEADLESS: "1"
    tty: true
    init: true
    networks:
      - sg-services-network
    # --tunnel: el bundle baja desde exp.direct, no desde la IP local, así que
    # sirve desde cualquier red. --port y REACT_NATIVE_PACKAGER_HOSTNAME solo
    # aplican en --lan (docs Expo: "--port does not apply to web or tunnel");
    # se conservan para poder volver a --lan cambiando una palabra.
    command: sh -c "[ -d node_modules/expo ] || npm install; export REACT_NATIVE_PACKAGER_HOSTNAME=\"$${EXPO_LAN_IP:-}\"; exec ./node_modules/.bin/expo start --tunnel --port 9081"

  # Túnel público de la API: Kong solo escuchaba en la LAN
  # (http://192.168.100.73:8000), por lo que desde otra red la app abría pero
  # todos los requests fallarían. Quick tunnel: sin cuenta ni token.
  # La URL pública cambia en cada reinicio; obtenerla con:
  #   docker logs sg-cloudflared 2>&1 | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | tail -1
  # Pegarla en dvlp-front/dvlp-movil/guardian-escolar/.env como
  # EXPO_PUBLIC_API_URL y reiniciar expo (se empaqueta al arrancar).
  cloudflared:
    container_name: sg-cloudflared
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --url http://kong:8000 --no-autoupdate
    networks:
      - sg-services-network
    restart: unless-stopped

volumes:
  expo_node_modules:

networks:
  sg-services-network:
    external: true
