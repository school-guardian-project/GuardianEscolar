<app-navbar-manage backRoute="/dashboard-admin"></app-navbar-manage>
<!-- CONTENIDO PRINCIPAL -->
<div class="page-wrapper">
  <app-navbar-admin></app-navbar-admin>
  <div class="container">
    <p *ngIf="actionError && !showUpdateModal && !showDeleteModal" class="action-error" role="alert">{{ actionError }}</p>
    <app-card-register
      type="bus"
      [fieldOptions]="fieldOptions"
      [fieldSelectOptions]="registerSelectOptions"
      (formSubmit)="onCreated($event)"
    ></app-card-register>
    <app-card-list type="bus" 
    [data]="buses"
    [remoteSearch]="true"
    (search)="onSearch($event)"
    (viewItem)="showDetails($event)" 
    (editItem)="showUpdateDetails($event)"
    (deleteItem)="showDelete($event)">
    </app-card-list>
  </div>
</div>

<!-- Modal de detalles a nivel de página -->
<app-record-information 
  *ngIf="showModal"
  type="bus"
  [record]="busSelected"
  [canAssign]="true"
  (assign)="showAssignDetails($event)"
  (closed)="closeModal()">
</app-record-information>

<app-update-record
  *ngIf="showUpdateModal"
  type="bus"
  [record]="busSelected"
  [fieldOptions]="updateFieldOptions"
  [fieldOptionLabels]="updateFieldOptionLabels"
  [saveError]="actionError"
  [saveFieldErrors]="saveFieldErrors"
  (saved)="onSaved($event)"
  (closed)="closeUpdateModal()">
</app-update-record>

<!-- Modal: eliminar registro -->
<app-delete-record
  *ngIf="showDeleteModal"
  type="bus"
  [record]="busSelected"
  [error]="actionError"
  (confirm)="onConfirmDelete($event)"
  (cancel)="closeDeleteModal()">  
  
</app-delete-record>

<!-- Modal: asignar/desasignar conductor del bus -->
<app-assign-record
  *ngIf="showAssignModal"
  type="bus"
  [record]="busSelected"
  (assigned)="onAssigned()"
  (closed)="closeAssignModal()">
</app-assign-record>
