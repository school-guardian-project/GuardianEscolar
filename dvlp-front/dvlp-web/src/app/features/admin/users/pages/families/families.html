<!-- ── familias.html — CRUD conectado a ms-user-management vía gateway ── -->
<app-navbar-manage backRoute="/dashboard-admin"></app-navbar-manage>

<div class="page-wrapper">
  <app-navbar-admin></app-navbar-admin>
  <div class="container">
    <app-card-register
      type="family"
      [fieldOptions]="fieldOptions"
      (formSubmit)="onCreated($event)"
    >
    </app-card-register>

    <app-card-list
      type="family"
      [data]="families()"
      (viewItem)="showDetails($event)"
      (editItem)="showUpdate($event)"
      (deleteItem)="showDelete($event)"
    >
    </app-card-list>
  </div>
</div>

<!-- Modal: ver detalles -->
<app-record-information
  *ngIf="showModal"
  type="family"
  [record]="familySelected"
  (closed)="closeModal()"
>
</app-record-information>

<!-- Modal: actualizar registro -->
<app-update-record
  *ngIf="showUpdateModal"
  type="family"
  [record]="familyToUpdate"
  [fieldOptions]="fieldOptions"
  (saved)="onSaved($event)"
  (closed)="closeUpdateModal()"
>
</app-update-record>

<!-- Modal: eliminar registro -->
<app-delete-record
  *ngIf="showDeleteModal"
  type="family"
  [record]="familySelected"
  (confirm)="onConfirmDelete($event)"
  (cancel)="closeDeleteModal()"
>
</app-delete-record>
