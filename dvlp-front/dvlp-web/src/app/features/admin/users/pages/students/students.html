<!-- ── estudiantes.html — CRUD conectado a ms-user-management vía gateway ── -->
<app-navbar-manage backRoute="/dashboard-admin"></app-navbar-manage>

<div class="page-wrapper">
  <app-navbar-admin></app-navbar-admin>
  <div class="container">
    <p *ngIf="actionError && !showUpdateModal && !showDeleteModal" class="action-error" role="alert">{{ actionError }}</p>
    <app-card-register type="student" (formSubmit)="onCreated($event)"> </app-card-register>

    <app-card-list
      type="student"
      [data]="students()"
      [remoteSearch]="true"
      (search)="onSearch($event)"
      (viewItem)="showDetails($event)"
      (editItem)="showUpdate($event)"
      (deleteItem)="showDelete($event)"
    >
    </app-card-list>
  </div>
</div>

<!-- Modal: ver detalles -->
<app-record-information
  *ngIf="showModal"
  type="student"
  [record]="studentSelected"
  [canAssign]="true"
  (assign)="showAssign($event)"
  (closed)="closeModal()"
>
</app-record-information>

<!-- Modal: actualizar registro -->
<app-update-record
  *ngIf="showUpdateModal"
  type="student"
  [record]="studentSelected"
  [saveError]="actionError"
  (saved)="onSaved($event)"
  (closed)="closeUpdateModal()"
>
</app-update-record>

<!-- Modal: eliminar registro -->
<app-delete-record
  *ngIf="showDeleteModal"
  type="student"
  [record]="studentSelected"
  [error]="actionError"
  (confirm)="onConfirmDelete($event)"
  (cancel)="closeDeleteModal()"
>
</app-delete-record>

<!-- Modal: asignar estudiante a ruta y parada -->
<app-assign-record
  *ngIf="showAssignModal"
  type="student"
  [record]="studentSelected"
  (assigned)="onAssigned()"
  (closed)="closeAssignModal()"
>
</app-assign-record>
