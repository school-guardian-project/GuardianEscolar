<app-change-password 
  iconHead="mail" 
  [isThemed]="false"
  [title]="'forgot_password.title' | translate"
  [sessionDescription]="'forgot_password.session_description' | translate"
  [titleStep]="'forgot_password.title_step' | translate"
  [loginDescription]="'forgot_password.login_description' | translate"
  [buttonText]="'forgot_password.button' | translate" [returnStep]="'forgot_password.return' | translate"
  [disabled]="isSubmitting" [showProgress]="true" [currentStep]="1" [stepText]="'forgot_password.step_text' | translate" (return)="return()"
  (submit)="onSubmit()">

  <form [formGroup]="form">
    <div class="input-email">
      <label for="email">
        {{ 'login.right.email.label' | translate }}
      </label>

      <input type="email" id="email" formControlName="email" maxlength="100" autocomplete="email">

      <!-- Email inválido -->
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['email']">
        {{ 'login.right.email.errors.invalid' | translate }}
      </small>
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['maxlength']">
        {{ 'forgot_password.errors.email_too_long' | translate }}
      </small>

      <!-- Email requerido -->
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['required']">
        {{ 'login.right.email.errors.required' | translate }}
      </small>

      <p>{{ 'forgot_password.hint' | translate }}</p>
      <small class="error" role="alert" aria-live="polite" *ngIf="errorMessage">{{ errorMessage }}</small>
    </div>
  </form>

</app-change-password>
