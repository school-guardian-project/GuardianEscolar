<app-navbar-manage></app-navbar-manage>
<div class="page-wrapper">
  <app-sidebar-superadmin></app-sidebar-superadmin>
  <div class="container">
    <app-card-register type="schools" (formSubmit)="onCreated($event)"></app-card-register>
    <p *ngIf="actionError && !showUpdateModal && !showDeleteModal" class="action-error" role="alert">{{ actionError }}</p>
    <app-card-list type="schools"
      [data]="schools()"
      [remoteSearch]="true"
      (search)="onSearch($event)"
      (viewItem)="showDetails($event)"
      (editItem)="showUpdate($event)"
      (deleteItem)="showDelete($event)">
    </app-card-list>
  </div>
</div>

<app-record-information
  *ngIf="showModal"
  type="schools"
  [record]="schoolSelected"
  (closed)="closeModal()">
</app-record-information>

<app-update-record
  *ngIf="showUpdateModal"
  type="schools"
  [record]="schoolSelected"
  [cityOptions]="cityOptions"
  [saveError]="actionError"
  (saved)="onSaved($event)"
  (closed)="closeUpdateModal()">
</app-update-record>

<app-delete-record
  *ngIf="showDeleteModal"
  type="schools"
  [record]="schoolSelected"
  [error]="actionError"
  (confirm)="onConfirmDelete($event)"
  (cancel)="closeDeleteModal()">
</app-delete-record>
