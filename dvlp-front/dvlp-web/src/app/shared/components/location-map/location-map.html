<div class="location-map">
  <div class="location-map__toolbar">
    <button type="button" class="location-map__locate" (click)="useDeviceLocation()" [disabled]="locating">
      <mat-icon aria-hidden="true">my_location</mat-icon>
      {{ (locating ? 'locationMap.locating' : 'locationMap.useDeviceLocation') | translate }}
    </button>
  </div>
  <!-- ngSkipHydration: Leaflet escribe su propio DOM dentro de este nodo; sin
       esto Angular compara el HTML prerenderizado con el que inserta Leaflet,
       marca un desajuste de hidratacion y deja de enlazar los eventos. -->
  <div #canvas class="location-map__canvas" aria-label="Map" ngSkipHydration></div>
  <p class="location-map__coords" aria-live="polite">{{ coordinatesLabel }}</p>
  @if (mapMessageKey) {
    <p class="location-map__message" role="status">{{ mapMessageKey | translate }}</p>
  }
</div>
