<div class="modal-backdrop" (click)="closeModal()">
  <section class="modal" (click)="$event.stopPropagation()" aria-labelledby="theme-title">
    <h3 id="theme-title">{{ 'theme.title' | translate }}</h3>
    <p>{{ 'theme.subtitle' | translate }}</p>

    <h4>{{ 'theme.light' | translate }} / {{ 'theme.dark' | translate }}</h4>
    <div class="mode-options">
      <button
        type="button"
        class="mode-option"
        [class.active]="!isDark"
        [attr.aria-pressed]="!isDark"
        (click)="setMode('light')"
      >
        <span class="mode-preview mode-preview-light" aria-hidden="true">
          <span class="preview-header" [style.backgroundColor]="previewAccent('light')"></span>
          <span class="preview-content">
            <span class="preview-line preview-line-long"></span>
            <span class="preview-line preview-line-short"></span>
            <span class="preview-card"></span>
          </span>
        </span>
        <span class="mode-label">{{ 'theme.light' | translate }}</span>
        <span class="selection-indicator" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="mode-option"
        [class.active]="isDark"
        [attr.aria-pressed]="isDark"
        (click)="setMode('dark')"
      >
        <span class="mode-preview mode-preview-dark" aria-hidden="true">
          <span class="preview-header" [style.backgroundColor]="previewAccent('dark')"></span>
          <span class="preview-content">
            <span class="preview-line preview-line-long"></span>
            <span class="preview-line preview-line-short"></span>
            <span class="preview-card"></span>
          </span>
        </span>
        <span class="mode-label">{{ 'theme.dark' | translate }}</span>
        <span class="selection-indicator" aria-hidden="true"></span>
      </button>
    </div>

    <h4 class="color-heading">{{ 'theme.color' | translate }}</h4>
    <div class="color-options">
      <button
        *ngFor="let color of colors"
        type="button"
        class="color-option"
        [class.active]="currentColor === color.name"
        [attr.aria-label]="color.translationKey | translate"
        [attr.aria-pressed]="currentColor === color.name"
        (click)="setColor(color.name)"
      >
        <span class="color-swatch" [style.backgroundColor]="color.value" aria-hidden="true">
          <span *ngIf="currentColor === color.name" class="color-check">✓</span>
        </span>
        <span class="color-label">{{ color.translationKey | translate }}</span>
      </button>
    </div>

    <button type="button" class="close-btn" (click)="closeModal()">
      {{ 'common.cancel' | translate }}
    </button>
  </section>
</div>
