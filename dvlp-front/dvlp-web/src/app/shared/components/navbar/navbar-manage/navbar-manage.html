<mat-toolbar class="custom-toolbar">
  <!-- IZQUIERDA -->
  <div class="toolbar-start">
    <button (click)="goBack()" mat-icon-button [attr.aria-label]="'responsive.dashboard' | translate">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <button class="mobile-menu-button" type="button" mat-icon-button (click)="openMenu()"
      [attr.aria-expanded]="menuOpen" aria-haspopup="dialog"
      [attr.aria-label]="'responsive.openMenu' | translate">
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <span class="spacer"></span>
  <span class="title">Guardian Escolar</span>
  <span class="spacer"></span>

  <!-- DERECHA -->
  <div class="toolbar-end">
    <button class="logout-icon" mat-icon-button type="button" (click)="confirmLogout = true"
      [attr.aria-label]="'admin_profile.logout' | translate" [title]="'admin_profile.logout' | translate">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>

<app-logout-confirm *ngIf="confirmLogout" (cancel)="confirmLogout = false" (confirm)="logout()"></app-logout-confirm>
