<div class="card-register">
  <h2 class="card-register__title">
    {{ titleKey | translate }}
  </h2>

  <form (ngSubmit)="onSubmit()">
    <ng-container *ngFor="let group of groupedFields">
      <!-- Dos campos en fila -->
      <div class="card-register__row" *ngIf="isArray(group)">
        <ng-container *ngFor="let field of group">
          <div class="card-register__field card-register__field--half">
            <label class="card-register__label">
              {{ getLabelKey(field.name) | translate }}
            </label>
            <div class="card-register__input-wrap" [class.card-register__input-wrap--multiple]="isFamilyStudentField(field.name)">
              <select *ngIf="field.type === 'select'"
                      class="card-register__input"
                      [ngModel]="isFamilyStudentField(field.name) ? selectedStudent : formData[field.name]"
                      [name]="field.name"
                      (ngModelChange)="onSelectChange(field.name, $event)"
                      (blur)="validateField(field.name)">
                <option value="" disabled>{{ 'register.select' | translate }}</option>
                <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
              </select>
              <div *ngIf="isFamilyStudentField(field.name)" class="card-register__selected-items">
                <span *ngFor="let student of selectedStudents" class="card-register__selected-item">
                  {{ student }}
                  <button type="button" class="card-register__remove-btn" (click)="removeStudent(student)" [attr.aria-label]="'Remove ' + student">x</button>
                </span>
              </div>
              <input *ngIf="field.type !== 'select'"
                     class="card-register__input"
                     [type]="field.type"
                     [(ngModel)]="formData[field.name]"
                     [name]="field.name"
                     (blur)="validateField(field.name)" />
            </div>
            <small class="card-register__error" *ngIf="getFieldError(field.name)">
              {{ getFieldError(field.name) }}
            </small>
          </div>
        </ng-container>
      </div>

      <!-- Un campo -->
      <div class="card-register__field" *ngIf="!isArray(group)">
        <label class="card-register__label">
          {{ getLabelKey(group.name) | translate }}
        </label>
        <div class="card-register__input-wrap" [class.card-register__input-wrap--multiple]="isFamilyStudentField(group.name)">
          <select *ngIf="group.type === 'select'"
                  class="card-register__input"
                  [ngModel]="isFamilyStudentField(group.name) ? selectedStudent : formData[group.name]"
                  [name]="group.name"
                  (ngModelChange)="onSelectChange(group.name, $event)"
                  (blur)="validateField(group.name)">
            <option value="" disabled>{{ 'register.select' | translate }}</option>
            <option *ngFor="let opt of group.options" [value]="opt">{{ opt }}</option>
          </select>
          <div *ngIf="isFamilyStudentField(group.name)" class="card-register__selected-items">
            <span *ngFor="let student of selectedStudents" class="card-register__selected-item">
              {{ student }}
              <button type="button" class="card-register__remove-btn" (click)="removeStudent(student)" [attr.aria-label]="'Remove ' + student">x</button>
            </span>
          </div>
          <input *ngIf="group.type !== 'select'"
                 class="card-register__input"
                 [type]="group.type"
                 [(ngModel)]="formData[group.name]"
                 [name]="group.name"
                 (blur)="validateField(group.name)" />
        </div>
        <small class="card-register__error" *ngIf="getFieldError(group.name)">
          {{ getFieldError(group.name) }}
        </small>
      </div>
    </ng-container>

    <app-location-map *ngIf="type === 'stop'"
      [address]="formData['address']"
      [latitude]="formData['latitude']"
      [longitude]="formData['longitude']"
      (coordinatesChange)="onLocationChange($event)">
    </app-location-map>

    <button class="card-register__btn" type="submit">
      {{ 'register.button' | translate }}
    </button>

    <p class="card-register__message" *ngIf="validationMessage" role="alert">
      {{ validationMessage }}
    </p>
  </form>
</div>
